[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo11-tensorrt-realtime"
version = "0.1.0"
description = "YOLO11s real-time detection and TensorRT FP16 deployment pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zack Zhang"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "torch>=2.2",
  "ultralytics>=8.3.0",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
tensorrt = ["tensorrt>=10.0", "cuda-python>=12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

